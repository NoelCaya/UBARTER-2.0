<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — UBarter 2.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 32px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon {
      width: 80px; height: 80px;
      background: #fef2f2;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 2rem;
    }
    h1 { font-size: 1.4rem; font-weight: 800; color: #1a1209; margin-bottom: 10px; }
    p  { font-size: 0.88rem; color: #6b7280; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      background: #7b0f10;
      color: #fff;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 12px 28px;
      border-radius: 12px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #5a0a0b; }
    .logo {
      font-size: 1rem; font-weight: 900;
      color: #7b0f10; margin-bottom: 32px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="logo">UBarter 2.0</span>
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>It looks like you lost your internet connection. Check your connection and try again.</p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
